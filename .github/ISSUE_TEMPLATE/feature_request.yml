name: 💡 Feature request
description: Suggest an idea for PIVXie
title: 'Feature: <title>'
labels: [Feature Request]
body:
  - type: textarea
    attributes:
      label: 'Problem'
      description: 'Is your idea about a problem? Describe it, e.g. "It''s hard to ... when ...".'
    validations:
      required: false
  - type: textarea
    attributes:
      label: 'Your idea'
      description: 'Describe what you would like PIVXie to do.'
    validations:
      required: true
  - type: textarea
    attributes:
      label: 'Alternatives'
      description: 'Other ways to solve it that you have thought about, if any.'
    validations:
      required: false
  - type: textarea
    attributes:
      label: 'Anything else'
      description: 'Screenshots, mockups, or how other PIVX wallets (such as MyPIVXWallet) handle it.'
    validations:
      required: false
