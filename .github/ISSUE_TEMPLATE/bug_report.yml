name: 🐞 Bug report
description: Report something in PIVXie that doesn't work as it should
title: 'Bug: <title>'
labels: [Bug]
body:
  - type: markdown
    attributes:
      value: |
        :stop_sign: _For questions and help with your wallet, ask the PIVX community on [Discord](https://discord.pivx.org/), [Telegram](https://t.me/PIVX_official) or [Reddit](https://www.reddit.com/r/pivx/), or email support@pivxie.me._

        :warning: **Never share your recovery phrase, private keys, PIN or backup password**, here or anywhere else. Nobody from PIVXie will ever ask for them.
  - type: checkboxes
    attributes:
      label: 'Is there an existing issue for this?'
      description: 'Please search the existing issues first to check whether this bug has already been reported.'
      options:
      - label: 'I have searched the existing issues'
        required: true
  - type: textarea
    attributes:
      label: 'What happened'
      description: 'Describe the problem. Screenshots are welcome, but hide your balances and addresses if you prefer. **Please don''t paste logs here.**'
    validations:
      required: true
  - type: textarea
    attributes:
      label: 'What you expected'
      description: 'Describe what should have happened instead.'
    validations:
      required: true
  - type: textarea
    attributes:
      label: 'Steps to reproduce'
      description: 'The shortest list of steps that shows the problem. Any steps are better than none.'
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 'Area'
      description: 'Which part of the app is it about?'
      options:
        - Sending or receiving
        - SHIELD (private transactions)
        - Cold staking
        - Masternodes
        - Governance (proposals and votes)
        - Transaction history
        - Sync or connection to the server
        - Backup and restore
        - PIN, fingerprint or app lock
        - Something else
    validations:
      required: true
  - type: textarea
    attributes:
      label: 'Environment'
      description: 'The app version is in Settings > About.'
      value: |
          - PIVXie version:
          - Network (mainnet or testnet):
          - Device and OS version (e.g. Galaxy S26 Ultra, Android 17):
          - Server (default or your own pivx-bridge):
    validations:
      required: true
  - type: input
    attributes:
      label: 'Logs'
      description: |
        Get the logs in Settings > Advanced > Logging (Save logs to a file, or Share logs), upload them to a [Gist](https://gist.github.com) and link it here.

        :warning: _Logs can contain addresses and transaction IDs. Check them and remove anything you don't want to share._
      placeholder: 'https://gist.github.com/...'
    validations:
      required: false
  - type: textarea
    attributes:
      label: 'Anything else'
      description: 'Links, transaction IDs, or anything else that gives us more context.'
    validations:
      required: false
