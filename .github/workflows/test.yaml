name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Writes pubspec.yaml, lib/app_config.g.dart and the PIVX plugin
      # interfaces. -i: no native plugin builds, -s: system libsecret.
      - name: Configure app
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -a pivxie -p linux -v 0.0.1 -b 1 -i -s

      - name: Get dependencies
        run: flutter pub get

      - name: Build libsecp256k1 for the host tests
        run: |
          cd scripts/linux
          ./build_secp256k1.sh
          test -s ../../build/libsecp256k1.so

      - name: Check formatting of changed files
        if: github.event_name == 'pull_request'
        run: |
          BASE=$(git merge-base ${{ github.event.pull_request.base.sha }} HEAD)
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE"..HEAD -- '*.dart')
          if [ -z "$FILES" ]; then
            echo "No Dart files changed."
            exit 0
          fi
          echo "Checking formatting of $(echo "$FILES" | wc -l) file(s):"
          echo "$FILES"
          dart format --output=none --set-exit-if-changed $FILES

      # The Isar tests load libisar.so: without a Linux build, the one
      # isar_community_flutter_libs ships (the version pub resolved).
      - name: Test
        run: |
          ISAR_PKG=$(jq -r '.packages[] | select(.name == "isar_community_flutter_libs") | .rootUri' .dart_tool/package_config.json)
          export ISAR_LIB="${ISAR_PKG#file://}/linux/libisar.so"
          test -s "$ISAR_LIB"
          flutter test --concurrency=4 $(find test -name "*_test.dart" ! -path "test/pivx/*")

      # The regtest tests skip themselves here: they need a PIVX Core
      # regtest node and a pivx-bridge (see docs/building.md).
      - name: Test PIVX
        run: flutter test --concurrency=1 test/pivx/
