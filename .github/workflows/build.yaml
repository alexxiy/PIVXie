name: Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.2.3)'
        required: true
        default: '0.0.1'
      build_number:
        description: 'Build number (integer)'
        required: true
        default: '1'
      testnet:
        description: 'Include the PIVX testnet (test builds only)'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: 3.47.7
  ANDROID_NDK_VERSION: 28.0.13004108

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_number: ${{ steps.ver.outputs.build_number }}
      dart_defines: ${{ steps.ver.outputs.dart_defines }}
    steps:
      - name: Set version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            BUILD_NUMBER="${{ github.run_number }}"
          else
            VERSION="${{ inputs.version }}"
            BUILD_NUMBER="${{ inputs.build_number }}"
          fi
          DEFINES=""
          if [ "${{ inputs.testnet }}" = "true" ]; then
            DEFINES="--dart-define=PIVX_TESTNET=true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "dart_defines=${DEFINES}" >> "$GITHUB_OUTPUT"

      - name: Post tester note
        if: github.ref_type != 'tag'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          > [!CAUTION]
          > **These are development builds, not releases.** They have not been tested and may contain bugs. Use them at your own risk and not with real funds.
          EOF

  build-android:
    runs-on: ubuntu-24.04
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The SHIELD library (crypto_plugins/flutter_libpivxshield) is Rust,
      # built by cargokit during the Flutter build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure app
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -a pivxie -p android -i \
            -v "${{ needs.version.outputs.version }}" \
            -b "${{ needs.version.outputs.build_number }}"

      - name: Get dependencies
        run: flutter pub get

      # Release signing comes from the ANDROID_KEYSTORE_BASE64,
      # ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
      # secrets. Without them (forks, test runs) the build is signed with a
      # throwaway key: fine for testing, never for publishing.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          else
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::Release builds need the ANDROID_KEYSTORE_BASE64 secret"
              exit 1
            fi
            echo "::warning::No signing secrets: using a throwaway key (test build only)"
            STORE_PASSWORD=$(openssl rand -hex 16)
            KEY_PASSWORD=$STORE_PASSWORD
            KEY_ALIAS=test
            keytool -genkeypair -keystore android/release.jks -storetype pkcs12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=PIVXie test build" -noprompt
          fi
          cat > android/key.properties << EOF
          storeFile=../release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi ${{ needs.version.outputs.dart_defines }}
          flutter build apk --release ${{ needs.version.outputs.dart_defines }}

      - name: Build AAB
        run: flutter build appbundle --release ${{ needs.version.outputs.dart_defines }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
               "out/pivxie-${VERSION}-android-${abi}.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk "out/pivxie-${VERSION}-android-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/pivxie-${VERSION}-android.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: pivxie-${{ env.VERSION }}-android
          path: out/

  # Unsigned: sign the IPA with your Apple certificate before installing it.
  build-ios:
    runs-on: macos-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Configure app
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -a pivxie -p ios -i \
            -v "${{ needs.version.outputs.version }}" \
            -b "${{ needs.version.outputs.build_number }}"

      - name: Get dependencies
        run: flutter pub get

      - name: Build
        run: flutter build ios --release --no-codesign ${{ needs.version.outputs.dart_defines }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr "pivxie-${VERSION}-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v7
        with:
          name: pivxie-${{ env.VERSION }}-ios-unsigned.ipa
          path: pivxie-${{ env.VERSION }}-ios-unsigned.ipa

  build-linux:
    runs-on: ubuntu-24.04
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      # -s: link the system libsecret and jsoncpp.
      - name: Configure app
        env:
          USE_SYSTEM_SECURE_STORAGE_DEPS: "1"
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -a pivxie -p linux -i -s \
            -v "${{ needs.version.outputs.version }}" \
            -b "${{ needs.version.outputs.build_number }}"

      # The QR scanner's camera support links a small static OpenCV, so the
      # bundle runs without OpenCV installed.
      - name: Cache OpenCV
        uses: actions/cache@v5
        with:
          path: scripts/linux/build/opencv/install
          key: opencv-${{ hashFiles('scripts/linux/build_opencv.sh') }}

      - name: Build OpenCV
        working-directory: scripts/linux
        run: ./build_opencv.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Build
        env:
          USE_SYSTEM_SECURE_STORAGE_DEPS: "1"
        run: flutter build linux --release ${{ needs.version.outputs.dart_defines }}

      - name: Package
        run: |
          tar -czf "pivxie-${VERSION}-linux-x86_64.tar.gz" \
            -C build/linux/x64/release bundle

      - uses: actions/upload-artifact@v7
        with:
          name: pivxie-${{ env.VERSION }}-linux-x86_64.tar.gz
          path: pivxie-${{ env.VERSION }}-linux-x86_64.tar.gz

  build-flatpak:
    runs-on: ubuntu-24.04
    needs: [version, build-linux]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: pivxie-${{ env.VERSION }}-linux-x86_64.tar.gz

      - name: Stage bundle and icon
        run: |
          sudo apt-get update -q
          sudo apt-get install -y imagemagick
          tar -xzf "pivxie-${VERSION}-linux-x86_64.tar.gz" -C flatpak/
          convert asset_sources/icon/pivxie/icon.png -resize 512x512 \
            flatpak/alexxiy.pivxie.PIVXie.png

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak SDK
        uses: actions/cache@v5
        with:
          path: ~/.local/share/flatpak
          key: flatpak-freedesktop-26.08-v1

      - name: Install Flatpak SDK
        run: |
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean \
            --repo=flatpak-repo \
            build-flatpak flatpak/alexxiy.pivxie.PIVXie.yaml

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle flatpak-repo \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "pivxie-${VERSION}-x86_64.flatpak" \
            alexxiy.pivxie.PIVXie

      - uses: actions/upload-artifact@v7
        with:
          name: pivxie-${{ env.VERSION }}-x86_64.flatpak
          path: pivxie-${{ env.VERSION }}-x86_64.flatpak

  build-appimage:
    runs-on: ubuntu-24.04
    needs: [version, build-linux]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: pivxie-${{ env.VERSION }}-linux-x86_64.tar.gz

      - name: Install AppImage tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y squashfs-tools

      - name: Build AppImage
        run: |
          tar -xzf "pivxie-${VERSION}-linux-x86_64.tar.gz"
          mkdir -p AppDir
          cp -r bundle/* AppDir/
          cp appimage/pivxie/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp appimage/pivxie/pivxie.desktop AppDir/
          cp asset_sources/icon/pivxie/icon.png AppDir/pivxie.png
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            "pivxie-${VERSION}-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: pivxie-${{ env.VERSION }}-x86_64.AppImage
          path: pivxie-${{ env.VERSION }}-x86_64.AppImage
