# flutter gen-l10n (run by `flutter pub get` and builds, pubspec `generate: true`):
# lib/l10n/app_*.arb -> lib/l10n/app_localizations*.dart (generated, not in git).
# A text missing from a language's file shows in English.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
