name: flutter_libpivxshield
description: PIVX Shield (Sapling) wallet core for Flutter via dart:ffi. Rust port of PIVX-Labs/pivx-shield, built with cargokit.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
