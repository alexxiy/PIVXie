name: PLACEHOLDER
description: PLACEHOLDER

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: PLACEHOLDER_V+PLACEHOLDER_B

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ^3.47.7

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.1
  mutex: ^3.0.0

# %%ENABLE_TOR%%
#  tor_ffi_plugin:
#    git:
#      url: https://github.com/cypherstack/tor.git
#      ref: 5586bfa3c48e495bc00f9b56fa18869daf768573
# %%END_ENABLE_TOR%%

# %%ENABLE_PIVX%%
#  flutter_libpivxshield:
#    path: ./crypto_plugins/flutter_libpivxshield
# %%END_ENABLE_PIVX%%

  stack_wallet_backup:
    git:
      url: https://github.com/cypherstack/stack_wallet_backup.git
      ref: 5efe8f8f259317d32b6f037cf91f62e06125c040

  # Utility plugins
  http: ^1.6.0
  local_auth: ^3.0.2
  local_auth_android: ^2.0.0
  permission_handler: ^13.0.2
  zxcvbn: ^1.0.0
  dart_numerics: ^0.0.6

  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size

  # Bitcoin-style key and address plugins
  bip39:
    git:
      url: https://github.com/cypherstack/stack-bip39.git
      ref: 20bc8ca0bf0a30c6965977a26c41475a9e862020
  coinlib_flutter:
    git:
      url: https://github.com/cypherstack/coinlib
      path: coinlib_flutter
      ref: f0e12dacb6d39e1cb340f0deae178d0fad1d6fd6
  dart_bs58: ^1.0.1
  dart_bs58check:
    git:
      url: https://github.com/cypherstack/dart-bs58check
      ref: bed60e43e4e509ea45bb097e6caee9f8293ddf98
  hex: ^0.2.0
  crypto: ^3.0.2

  # Storage plugins
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.20.2
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  saf_util: ^3.1.1
  saf_stream: ^4.0.2

  # UI/Component plugins
  flutter_native_splash: ^2.4.8
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  qr_flutter: ^4.0.0
  dropdown_button2: ^3.1.0
  calendar_date_picker2: ^4.0.0
  another_flushbar: ^2.2.4
  keyboard_dismisser: ^3.0.0
  emojis: ^3.2.0
  flutter_riverpod: ^3.4.3

  # Platform plugins
  wakelock_plus: ^1.8.1
  devicelocale: 0.9.1
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  mobile_scanner: ^7.4.2
  mobile_app_privacy:
    git:
      url: https://github.com/cypherstack/mobile_app_privacy
      ref: v0.0.3
  camera_linux:
    git:
      url: https://github.com/cypherstack/camera-linux
      ref: ecb412474c5d240347b04ac1eb9f019802ff7034
  camera_windows:
    git: # TODO [prio=low]: Revert to official after https://github.com/flutter/packages/pull/7067.
      url: https://github.com/cypherstack/packages.git
      path: packages/camera/camera_windows
  camera_platform_interface: ^2.14.0
  camera_macos: ^0.1.1
  zxing2: ^0.2.3
  image: ^4.12.0

  # Dart utilities
  decimal: ^3.2.6
  intl: ^0.20.3
  event_bus: ^2.0.0
  uuid: ^4.6.0
  tuple: ^2.0.0
  equatable: ^3.0.0
  async: ^2.13.1
  archive: ^4.5.0
  meta: ^1.9.1
  socks5_proxy: ^2.1.1
  logger:
    git:
      url: https://github.com/cypherstack/logger
      ref: 3c0cba27868ebb5c7d65ebc30a8e6e5342186692

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1 # 2.16 needs a newer analyzer than isar_community_generator allows
  flutter_launcher_icons: ^0.14.4
  hive_ce_generator: ^1.11.1 # 1.11.2+ needs analyzer 14, isar_community_generator <11
  dependency_validator: ^5.1.0
  hive_test: ^1.0.1
  mockito: ^5.6.4 # 5.6.5+ needs a newer analyzer than isar_community_generator allows
  import_sorter: ^4.6.0
  flutter_lints: ^6.0.0
  isar_community_generator: 3.3.2

flutter_native_splash:
  image: assets/icon/splash.png
  color: "F7F7F7"
  color_dark_ios: "2A2D34"
  color_dark_android: "2A2D34"
  # Without it, `flutter_native_splash:create` strips the portrait lock
  # from AndroidManifest.xml.
  android_screen_orientation: portrait
  android_12:
    color: "F7F7F7"
    color_dark: "2A2D34"

dependency_overrides:
  # coinlib_flutter requires this
  coinlib:
    git:
      url: https://github.com/cypherstack/coinlib
      path: coinlib
      ref: f0e12dacb6d39e1cb340f0deae178d0fad1d6fd6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  assets:
    - assets/in_app_logo_icons/
    # assets/icon/ only feeds the launcher icon / splash generators.
    - google_fonts/
    - assets/svg/

    # coin control icons
    - assets/svg/coin_control/

    # socials
    - assets/svg/socials/

    # PIVXie mascot (Void Pixie), 1.5x-4.0x density variants
    - assets/persona/

    # lottie animations
    # basic
    - assets/lottie/loader.json
    - assets/lottie/icon_send.json
    - assets/lottie/loader_and_checkmark.json
    - assets/lottie/arrow_rotate.json
    - assets/lottie/onion_animation.json

    # default themes_testing
    - assets/default_themes/


import_sorter:
  comments: false # Optional, defaults to true
  ignored_files: # Optional, defaults to []
    - \/test\/*
    - \/crypto_plugins\/*
    - \/integration_test\/*
