# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  image_path_android: "assets/icon/macos-icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  # Android 8+: the pixie on the tile's violet; launchers mask it into
  # their own shape. The foreground is inset 16% (the safe zone).
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"

  ios: false

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false
